<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de usuarios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="admin-container">
        <div class="actions">
            <a href="index.html"><button type="button">Ir a Calculadora</button></a>
            <a href="clients.html"><button type="button">Ir a Clientes</button></a>
            <button type="button" id="logout-btn">Cerrar sesión</button>
        </div>
        <h1>Administración de usuarios</h1>
        <div class="form-group">
            <label for="new-user-username">Nuevo usuario:</label>
            <input type="text" id="new-user-username" placeholder="usuario">
        </div>
        <div class="form-group">
            <label for="new-user-role">Rol:</label>
            <select id="new-user-role">
                <option value="employee">Proveedor</option>
                <option value="admin">Administrador</option>
            </select>
        </div>
        <div class="form-group">
            <label for="new-user-password">Contraseña temporal:</label>
            <input type="password" id="new-user-password">
        </div>
        <button type="button" id="create-user-btn">Crear usuario</button>
        <div class="table-wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="users-tbody"></tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
