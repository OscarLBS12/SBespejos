<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="login-container">
        <h1>Acceso</h1>
        <div id="setup-admin-card" style="display:none;">
            <div class="form-group">
                <label for="setup-admin-username">Usuario administrador:</label>
                <input type="text" id="setup-admin-username" placeholder="admin">
            </div>
            <div class="form-group">
                <label for="setup-admin-password">Contraseña:</label>
                <input type="password" id="setup-admin-password">
            </div>
            <div class="form-group">
                <label for="setup-admin-password2">Confirmar contraseña:</label>
                <input type="password" id="setup-admin-password2">
            </div>
            <button type="button" id="setup-admin-btn">Crear administrador</button>
        </div>
        <div id="login-card" style="display:none;">
            <div class="form-group">
                <label for="login-username">Usuario:</label>
                <input type="text" id="login-username">
            </div>
            <div class="form-group">
                <label for="login-password">Contraseña:</label>
                <input type="password" id="login-password">
            </div>
            <button type="button" id="login-btn">Entrar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
